server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Regenerated at container start by docker-entrypoint.sh — never cache.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }
}
