server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy backend API & health endpoints for same-origin Docker deployment
    location /api/ {
        proxy_pass https://satquery-backend-9s36.onrender.com;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass https://satquery-backend-9s36.onrender.com;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Development auto-refresh live-reload SSE stream
    location /live-reload {
        proxy_pass http://host.docker.internal:35729/live-reload;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_set_header Host $host;
    }

    # Regenerated at container start by docker-entrypoint.sh — never cache.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }
}
